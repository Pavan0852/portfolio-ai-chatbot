
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-ai-chatbot"
version = "0.1.0"
description = "A modular RAG-powered conversational assistant for a developer portfolio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "openai>=1.50,<3.0",
    "httpx>=0.27,<1.0",
    "qdrant-client>=1.12,<2.0",
    "slowapi>=0.1.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "packages*"]
exclude = [
    "frontend*",
    "knowledge*",
    "evals*",
    "infra*",
    "tests*",
]
